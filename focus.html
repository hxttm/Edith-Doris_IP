<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Mode - Dream Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app_top" aria-label="Top bar">
    <div class="app_top_left">
      <div class="app_title">Focus Mode</div>
    </div>

    <div class="app_top_right">
      <button
        type="button"
        class="music_btn"
        id="musicBtn"
        aria-label="Music"
        aria-expanded="false"
        aria-controls="musicPanel"
      >
        ♪
      </button>

      <div class="music_panel" id="musicPanel" hidden>
        <div class="music_panel_head">
          <div class="music_panel_title">Sound</div>
          <button type="button" class="music_close" id="musicClose" aria-label="Close">✕</button>
        </div>

        <div class="music_list" role="menu" aria-label="Music options">
          <button class="music_item" type="button" data-track="white" role="menuitem">White Noise</button>
          <button class="music_item" type="button" data-track="lofi" role="menuitem">Lofi</button>
          <button class="music_item" type="button" data-track="rain" role="menuitem">Rain</button>
          <button class="music_item" type="button" data-track="brown" role="menuitem">Brown Noise</button>
          <button class="music_item" type="button" data-track="cafe" role="menuitem">Cafe Ambience</button>
        </div>

        <div class="music_controls">
          <button class="music_toggle" id="musicToggle" type="button">Play</button>
          <button class="music_stop" id="musicStop" type="button">Stop</button>
        </div>

        <div class="music_now" id="musicNow">Not playing</div>
      </div>

      <audio id="focusAudio" preload="metadata"></audio>
    </div>
  </header>

  <div class="dreampage dreampage_has_nav" id="pageRoot">
    <main class="ui_focus" aria-label="FocusMode">
      <header class="ui_top">
        <a class="ui_back is-hidden" href="#" aria-label="Back"></a>
        <div class="ui_title">Focus Mode</div>
        <div class="ui_top_spacer" aria-hidden="true"></div>
      </header>

      <div class="particles active" id="particles"></div>

      <div class="timer-display" id="timerDisplay">00:00:00</div>

      <div class="pet-container">
        <img
          src="./assets/focus/blue.jpg"
          data-src-blue="./assets/focus/blue.jpg"
          data-src-orange="./assets/focus/orange.png"
          alt="Focus Pet"
          class="pet-image active"
          id="petImage"
        />
      </div>

      <div class="action-buttons">
        <button class="btn btn-notes" id="notesBtn" type="button">Your Notes</button>
        <button class="btn btn-end" id="endBtn" type="button">End Session</button>
      </div>
    </main>
  </div>

  <script>

    const THEME_KEY = "dream_buddy";
    const root = document.getElementById("pageRoot");

    function normTheme(v) {
      return (v || "blue").toLowerCase().trim();
    }

    function applyTheme() {
      const theme = normTheme(localStorage.getItem(THEME_KEY));
      const isOrange = theme === "orange";

      // apply classes (body controls .app_top too)
      document.body.classList.toggle("orange", isOrange);
      document.body.classList.toggle("blue", !isOrange);
      root?.classList.toggle("orange", isOrange);
      root?.classList.toggle("blue", !isOrange);

      // swap focus pet image
      const pet = document.getElementById("petImage");
      if (pet) {
        const blueSrc = pet.getAttribute("data-src-blue") || "./assets/focus/blue.jpg";
        const orangeSrc = pet.getAttribute("data-src-orange") || "./assets/focus/orange.png";
        const base = isOrange ? orangeSrc : blueSrc;

        pet.onerror = () => console.warn("[theme] pet image failed:", base);

        // cache-bust so switching always forces a new URL
        pet.src = base + (base.includes("?") ? "&" : "?") + "theme=" + encodeURIComponent(theme);
      }

      console.log("[theme]", { theme, petSrc: document.getElementById("petImage")?.src });
    }

    // run now + when page is restored via back button (bfcache)
    applyTheme();
    window.addEventListener("pageshow", applyTheme);
    window.addEventListener("focus", applyTheme);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) applyTheme(); });
    window.addEventListener("storage", (e) => { if (e.key === THEME_KEY) applyTheme(); });



    const tracks = {
      white: { name: "White Noise", src: "./assets/audio/white-noise.mp3" },
      lofi:  { name: "Lofi",        src: "./assets/audio/lofi.mp3" },
      rain:  { name: "Rain",        src: "./assets/audio/rain.mp3" },
      brown: { name: "Brown Noise", src: "./assets/audio/brown-noise.mp3" },
      cafe:  { name: "Cafe Ambience", src: "./assets/audio/cafe.mp3" },
    };

    const audio = document.getElementById("focusAudio");
    const musicBtn = document.getElementById("musicBtn");
    const musicPanel = document.getElementById("musicPanel");
    const musicClose = document.getElementById("musicClose");
    const musicToggle = document.getElementById("musicToggle");
    const musicStop = document.getElementById("musicStop");
    const musicNow = document.getElementById("musicNow");
    const trackBtns = Array.from(document.querySelectorAll(".music_item"));

    let currentTrackKey = null;

    function openPanel() {
      if (!musicPanel) return;
      musicPanel.hidden = false;
      musicBtn?.setAttribute("aria-expanded", "true");
    }
    function closePanel() {
      if (!musicPanel) return;
      musicPanel.hidden = true;
      musicBtn?.setAttribute("aria-expanded", "false");
    }
    function setActiveButton(key) {
      trackBtns.forEach(b => b.classList.toggle("is_active", b.dataset.track === key));
    }
    function updateNow() {
      if (!audio) return;
      const playing = !audio.paused && currentTrackKey;
      musicToggle.textContent = playing ? "Pause" : "Play";
      musicNow.textContent = currentTrackKey
        ? `${playing ? "Playing" : "Paused"}: ${tracks[currentTrackKey].name}`
        : "Not playing";
      musicBtn.textContent = playing ? "⏸" : "♪";
    }

    async function playTrack(key) {
      if (!audio || !tracks[key]) return;
      currentTrackKey = key;
      setActiveButton(key);

      if (audio.src !== new URL(tracks[key].src, location.href).href) {
        audio.src = tracks[key].src;
        audio.loop = true;
      }

      try {
        await audio.play();
      } catch (e) {
      }
      updateNow();
    }

    function pauseResume() {
      if (!audio) return;
      if (!currentTrackKey) {
        playTrack("white");
        return;
      }
      if (audio.paused) audio.play().catch(()=>{});
      else audio.pause();
      updateNow();
    }

    function stopAudio() {
      if (!audio) return;
      audio.pause();
      audio.currentTime = 0;
      currentTrackKey = null;
      setActiveButton(null);
      updateNow();
    }

    musicBtn?.addEventListener("click", () => {
      if (!musicPanel) return;
      musicPanel.hidden ? openPanel() : closePanel();
    });

    musicClose?.addEventListener("click", closePanel);

    trackBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        const key = btn.dataset.track;
        if (!key) return;

        if (currentTrackKey === key) pauseResume();
        else playTrack(key);
      });
    });

    musicToggle?.addEventListener("click", pauseResume);
    musicStop?.addEventListener("click", stopAudio);

    document.addEventListener("click", (e) => {
      if (!musicPanel || musicPanel.hidden) return;
      const target = e.target;
      if (!(target instanceof Node)) return;
      if (musicPanel.contains(target) || musicBtn?.contains(target)) return;
      closePanel();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closePanel();
    });

    updateNow();

    class FocusTimer {
      constructor() {
        const savedStart = sessionStorage.getItem("focusStartTime");
        this.startTime = savedStart ? parseInt(savedStart) : Date.now();
        sessionStorage.setItem("focusStartTime", this.startTime.toString());
        this.interval = null;
        this.timerDisplay = document.getElementById("timerDisplay");
        this.particles = document.getElementById("particles");

        this.bindEvents();
        this.createParticles();
        this.updateDisplay();
        this.start();
      }

      bindEvents() {
        document.getElementById("endBtn")?.addEventListener("click", () => this.endSession());
        document.getElementById("notesBtn")?.addEventListener("click", () => this.openNotes());
      }

      start() {
        if (this.interval) return;
        document.body.classList.add("timer-running");
        this.interval = setInterval(() => this.updateDisplay(), 1000);
      }

      updateDisplay() {
        const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
        const h = String(Math.floor(elapsed / 3600)).padStart(2, "0");
        const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, "0");
        const s = String(elapsed % 60).padStart(2, "0");
        this.timerDisplay.textContent = `${h}:${m}:${s}`;
      }

      endSession() {
        if (!confirm(`End session after ${this.formatTime(Math.floor((Date.now() - this.startTime) / 1000))}?`)) return;

        const sessionSeconds = Math.floor((Date.now() - this.startTime) / 1000);
        const prevTotal = Number(localStorage.getItem("dreamTotalFocusTime") || 0);
        const newTotal = prevTotal + sessionSeconds;

        localStorage.setItem("dreamTotalFocusTime", String(newTotal));
        sessionStorage.removeItem("focusStartTime");

        setTimeout(() => window.location.href = "./index.html", 50);
      }

      formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins}m ${secs}s`;
      }

      openNotes() {
        sessionStorage.setItem("fromFocus", "true");
        window.location.href = "./notes.html";
      }

      createParticles() {
        if (!this.particles) return;
        this.particles.innerHTML = "";
        for (let i = 0; i < 50; i++) {
          const p = document.createElement("div");
          p.className = "particle";
          p.style.left = Math.random() * 100 + "%";
          p.style.animationDelay = Math.random() * 6 + "s";
          p.style.animationDuration = (Math.random() * 3 + 4) + "s";
          this.particles.appendChild(p);
        }
      }
    }

    new FocusTimer();
  </script>

</body>
</html>
