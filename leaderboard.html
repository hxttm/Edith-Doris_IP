<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dream — Leaderboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="dreampage dreampage_has_nav" id="pageRoot">
    <main class="ui_s" aria-label="Leaderboard">
      <header class="app_top" aria-label="Top bar">
        <div class="app_top_left">
          <a class="ui_back" href="./index.html" aria-label="Back">‹</a>
          <div class="app_title">Leaderboard</div>
        </div>

        <nav class="app_nav" aria-label="Top navigation">
          <a class="app_nav_link" href="./index.html">home</a>
          <a class="app_nav_link" href="./chat.html">chat</a>
          <a class="app_nav_link" href="./market.html">notes</a>
          <a class="app_nav_link" href="./buddy.html">buddy</a>
          <a class="app_nav_link" href="./settings.html">settings</a>
        </nav>

        <div class="app_top_right">
          <button type="button" class="app_gem_pill" aria-label="Gems">
            <img class="app_gem_icon" src="assets/diamond.png" alt="" />
            <span class="app_gem_count">10</span>
          </button>
        </div>
      </header>

      <header class="ui_top">
        <a class="ui_back" href="./home.html" aria-label="Back">‹</a>
        <div class="ui_title">Leaderboard</div>
        <div class="ui_top_spacer"></div>
      </header>

      <section class="ui_sec">
        <div class="lb_list" id="lbList"></div>
      </section>
    </main>

    <nav class="ui_nav" aria-label="Bottom navigation">
        <a class="ui_nav_item" href="./buddy.html" aria-label="Customising avatar">
        <img class="ui_nav_icon" src="./assets/nav/avatar.png" alt="" />
        </a>

        <a class="ui_nav_item" href="./market.html" aria-label="Notes market">
        <img class="ui_nav_icon" src="./assets/nav/market.png" alt="" />
        </a>

        <a class="ui_nav_item ui_nav_item_active" href="./index.html" aria-label="Home" aria-current="page">
        <img class="ui_nav_icon" src="./assets/nav/home.png" alt="" />
        </a>

        <a class="ui_nav_item" href="./chat.html" aria-label="Chat">
        <img class="ui_nav_icon" src="./assets/nav/chat.png" alt="" />
        </a>

        <a class="ui_nav_item" href="./settings.html" aria-label="Settings">
        <img class="ui_nav_icon" src="./assets/nav/settings.png" alt="" />
        </a>
    </nav>
  </div>
  <script>
    const buddy = localStorage.getItem("dream_buddy") || "blue";
    document.body.classList.toggle("orange", buddy === "orange");
    document.body.classList.toggle("blue", buddy !== "orange");

    document.querySelectorAll(".ui_back").forEach(btn => {
      btn.addEventListener("click", (e) => {
        if (history.length > 1) { e.preventDefault(); history.back(); }
      });
    });

    const SHEET_ID = "1dzjZC25MIJSj1Dgj-dRDUs17s-Pj59Iq8Fh2wWeF2Ws";
    const SHEET_TAB_NAME = "Sheet1"; 

    const lbList = document.getElementById("lbList");

    async function loadLeaderboard() {
      try {
        lbList.innerHTML = `<div class="lb_row">Loading...</div>`;

        const query = `select A, B where A is not null order by B desc limit 50`;
        const url =
          `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?` +
          `tqx=out:json&sheet=${encodeURIComponent(SHEET_TAB_NAME)}` +
          `&tq=${encodeURIComponent(query)}`;

        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const text = await res.text();
        const json = JSON.parse(text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1));

        const rows = json.table.rows || [];
        const data = rows.map(r => ({
          name: r.c?.[0]?.v ?? "Anonymous",
          hours: Number(r.c?.[1]?.v ?? 0)
        }));

        if (!data.length) {
          lbList.innerHTML = `<div class="lb_row">No hours yet</div>`;
          return;
        }

        lbList.innerHTML = data.map((p, i) => `
          <div class="lb_row">
            <div class="lb_rank">${i + 1}</div>
            <div class="lb_name">${escapeHtml(p.name)}</div>
            <div class="lb_score">${p.hours.toLocaleString()} hrs</div>
          </div>
        `).join("");

      } catch (err) {
        console.error(err);
        lbList.innerHTML = `<div class="lb_row error-row">Failed to load leaderboard</div>`;
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s =>
        ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[s])
      );
    }

    document.addEventListener("DOMContentLoaded", loadLeaderboard);
    setInterval(loadLeaderboard, 30000);
  </script>


  </body>
</html>
